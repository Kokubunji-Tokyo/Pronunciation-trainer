<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語発音チェック＆シャドーイング練習</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      padding: 28px;
    }

    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: var(--text);
    }

    .section {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 1.15rem;
      line-height: 1.5;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      resize: vertical;
      font-family: inherit;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .presets {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .preset-btn {
      background: #e2e8f0;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text);
    }

    .preset-btn:hover {
      background: #cbd5e1;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: #f1f5f9;
      padding: 14px;
      border-radius: 8px;
    }

    button.action-btn {
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      background-color: var(--primary);
      transition: background-color 0.2s;
    }

    button.action-btn:hover {
      background-color: var(--primary-hover);
    }

    button.action-btn.recording {
      background-color: var(--danger);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.75; }
      100% { opacity: 1; }
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      margin-left: auto;
    }

    .result-box {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 18px;
      background: #fafafa;
      min-height: 110px;
    }

    .score-badge {
      display: inline-block;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      background: #e2e8f0;
    }

    .word-diff {
      font-size: 1.2rem;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .word-ok {
      color: var(--success);
      font-weight: 600;
      margin-right: 6px;
    }

    .word-ng {
      color: var(--danger);
      text-decoration: underline wavy var(--danger);
      font-weight: 600;
      margin-right: 6px;
    }

    .recognized-raw {
      font-size: 0.9rem;
      color: var(--muted);
      border-top: 1px solid #e2e8f0;
      padding-top: 8px;
    }

    .status {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>英語発音チェック＆シャドーイング練習</h1>

  <!-- 1. 練習テキスト入力 -->
  <div class="section">
    <label for="targetText">練習する英文（自由に編集できます）</label>
    <textarea id="targetText" rows="3">We need to touch base on the project timeline before the end of the day.</textarea>
    <div class="presets">
      <button class="preset-btn" onclick="setSample('We need to touch base on the project timeline before the end of the day.')">ビジネスフレーズ1</button>
      <button class="preset-btn" onclick="setSample('Could you walk me through the key takeaways from yesterday’s meeting?')">ビジネスフレーズ2</button>
      <button class="preset-btn" onclick="setSample('She sells seashells by the seashore.')">早口言葉 (S/SH)</button>
      <button class="preset-btn" onclick="setSample('Right light, red lorry, yellow lorry.')">早口言葉 (R/L)</button>
    </div>
  </div>

  <!-- 2. 音声再生＆録音コントロール -->
  <div class="section">
    <div class="controls">
      <button class="action-btn" onclick="speakText()">🔊 お手本を聴く</button>
      <button class="action-btn" id="recordBtn" onclick="toggleRecognition()">🎤 発音をチェック</button>
      
      <div class="speed-control">
        <label for="rateRange" style="margin:0;">速度: <span id="rateValue">1.0</span>x</label>
        <input type="range" id="rateRange" min="0.6" max="1.3" step="0.1" value="1.0" oninput="updateRate(this.value)">
      </div>
    </div>
    <div class="status" id="statusMsg">待機中：「発音をチェック」を押してマイクに向かって話してください。</div>
  </div>

  <!-- 3. 判定結果表示 -->
  <div class="section">
    <label>判定結果</label>
    <div class="result-box">
      <div id="scoreArea" class="score-badge">一致率: -- %</div>
      <div id="diffArea" class="word-diff">ここに単語ごとの正誤が表示されます。</div>
      <div id="rawArea" class="recognized-raw">認識された音声: （まだ録音されていません）</div>
    </div>
  </div>
</div>

<script>
  const targetInput = document.getElementById('targetText');
  const rateRange = document.getElementById('rateRange');
  const rateValue = document.getElementById('rateValue');
  const recordBtn = document.getElementById('recordBtn');
  const statusMsg = document.getElementById('statusMsg');
  const scoreArea = document.getElementById('scoreArea');
  const diffArea = document.getElementById('diffArea');
  const rawArea = document.getElementById('rawArea');

  let recognition = null;
  let isRecording = false;

  // サンプル文セット
  function setSample(text) {
    targetInput.value = text;
  }

  // 再生速度表示更新
  function updateRate(val) {
    rateValue.textContent = parseFloat(val).toFixed(1);
  }

  // お手本音声の再生 (Web Speech API - SpeechSynthesis)
  function speakText() {
    window.speechSynthesis.cancel();
    const text = targetInput.value.trim();
    if (!text) return;

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = parseFloat(rateRange.value);

    // 英語の自然な音声があれば優先選択
    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google')) 
                 || voices.find(v => v.lang.startsWith('en-'));
    if (enVoice) utterance.voice = enVoice;

    window.speechSynthesis.speak(utterance);
  }

  // 音声認識の初期化 (Web Speech API - SpeechRecognition)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isRecording = true;
      recordBtn.textContent = '⏹ 停止する';
      recordBtn.classList.add('recording');
      statusMsg.textContent = '聞き取り中... 英文を発音してください。';
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      evaluatePronunciation(transcript);
    };

    recognition.onerror = (event) => {
      statusMsg.textContent = 'エラーが発生しました: ' + event.error + '（マイクの許可を確認してください）';
    };

    recognition.onend = () => {
      isRecording = false;
      recordBtn.textContent = '🎤 発音をチェック';
      recordBtn.classList.remove('recording');
      if (statusMsg.textContent.startsWith('聞き取り中')) {
        statusMsg.textContent = '判定完了。';
      }
    };
  } else {
    statusMsg.textContent = '※お使いのブラウザは音声認識に対応していません。Google Chrome または Edge をご使用ください。';
    recordBtn.disabled = true;
  }

  function toggleRecognition() {
    if (!recognition) return;
    if (isRecording) {
      recognition.stop();
    } else {
      window.speechSynthesis.cancel();
      recognition.start();
    }
  }

  // 文字列の正規化（記号除去・小文字化）
  function normalizeWords(str) {
    return str
      .toLowerCase()
      .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"’']/g, '')
      .trim()
      .split(/\s+/)
      .filter(w => w.length > 0);
  }

  // 発音評価と単語ごとの差分表示
  function evaluatePronunciation(spokenText) {
    const originalText = targetInput.value.trim();
    const originalWordsRaw = originalText.split(/\s+/);
    const targetWords = normalizeWords(originalText);
    const spokenWords = normalizeWords(spokenText);

    rawArea.textContent = '認識された音声: "' + spokenText + '"';

    if (targetWords.length === 0) return;

    let matchCount = 0;
    let htmlResult = '';

    // 元の単語配列をベースに一致確認
    originalWordsRaw.forEach((rawWord) => {
      const cleanWord = rawWord.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"’']/g, '');
      if (cleanWord === '') {
        htmlResult += rawWord + ' ';
        return;
      }

      if (spokenWords.includes(cleanWord)) {
        matchCount++;
        htmlResult += `<span class="word-ok">${rawWord}</span>`;
      } else {
        htmlResult += `<span class="word-ng">${rawWord}</span>`;
      }
    });

    const score = Math.round((matchCount / targetWords.length) * 100);
    scoreArea.textContent = `一致率: ${score} % (${matchCount} / ${targetWords.length} 単語)`;
    
    if (score >= 80) {
      scoreArea.style.background = '#dcfce7';
      scoreArea.style.color = '#166534';
    } else if (score >= 50) {
      scoreArea.style.background = '#fef9c3';
      scoreArea.style.color = '#854d0e';
    } else {
      scoreArea.style.background = '#fee2e2';
      scoreArea.style.color = '#991b1b';
    }

    diffArea.innerHTML = htmlResult;
    statusMsg.textContent = '判定完了！赤字の単語を意識してもう一度試してみましょう。';
  }

  // 音声リストの事前読み込み（Chrome対策）
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
</script>

</body>
</html>
